name: CI

# Every push and pull request type-checks, builds and tests the site. A pull
# request, or a run started by hand, also audits each page with Lighthouse,
# checks its accessibility and compares each page with its reference
# screenshots; a push to main skips them, its pull request already ran them.
# A push to main then deploys it to Cloudflare Pages (getfoulee.app); a pull
# request gets its own preview URL, posted in the run summary.
#
# The repository is private: artifacts count against the organization's
# 500 MB of storage, so they are kept a day, and the Lighthouse reports only
# when an audit fails.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-screenshots:
        description: Capture new reference screenshots (artifact `screenshots`) instead of comparing
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    env:
      # Only the build that goes to getfoulee.app counts visits.
      ANALYTICS: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test the built site
        run: npm test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 1

  lighthouse:
    name: Lighthouse (${{ matrix.preset }})
    needs: build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # Mobile and desktop run side by side; one failing does not cancel the other.
    strategy:
      fail-fast: false
      matrix:
        preset: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist/

      # Every page: a category under 95 fails the run.
      - name: Audit every page
        run: npm run lighthouse:${{ matrix.preset }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: lighthouse-${{ matrix.preset }}
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 1

  browser:
    name: ${{ matrix.suite == 'a11y' && 'Accessibility' || 'Screenshots' }}
    needs: build
    if: github.event_name != 'push'
    # A fixed image: the reference screenshots are its rendering, and a new
    # Ubuntu would change the fonts under them. Moving it means new references.
    runs-on: ubuntu-24.04
    # Both suites run in Playwright, side by side; one failing does not cancel the other.
    strategy:
      fail-fast: false
      matrix:
        suite: [a11y, visual]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist/

      # The browser version comes from @playwright/test in package-lock.json.
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # a11y: axe and keyboard checks. visual: each page at 375 px and 1440 px
      # against its reference screenshot; a run started by hand with
      # update-screenshots rewrites the references instead. Both in light and dark.
      - name: Run the ${{ matrix.suite }} tests
        run: npm run test:${{ matrix.suite }} -- ${{ matrix.suite == 'visual' && inputs.update-screenshots && '--update-snapshots' || '' }}

      # The new references, to download and commit.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.suite == 'visual' && inputs.update-screenshots }}
        with:
          name: screenshots
          path: tests/__screenshots__/
          retention-days: 1

      # The actual capture and its difference with the reference, for each failure.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.suite == 'visual' && failure() }}
        with:
          name: screenshot-diffs
          path: test-results/
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare
    needs: build
    # Pull requests from forks get no secrets: they stop at the build.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      # Wrangler's version comes from package-lock.json, like every other tool.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist/

      - name: Create the Pages project on the first run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project list | grep -qw getfoulee \
            || npx wrangler pages project create getfoulee --production-branch=main

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=getfoulee --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.sha }}

      - name: Summary
        run: |
          echo "Deployed: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
